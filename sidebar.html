<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uhr und Fortschritt</title>
<style>
:root {
  --ink: #e9e9e7;       /* Notion dark text */
  --muted: #9b9b98;
  --tick: #6f6f6c;
  --font: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--ink); }
body { font-family: var(--font); padding: 10px 6px; }
.wrap { display: grid; gap: 18px; justify-items: center; max-width: 260px; margin: 0 auto; }
svg.clock { width: 150px; height: 150px; display: block; }
.bars { display: grid; gap: 12px; width: 100%; }
.row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 12px; }
.battery {
  position: relative; height: 30px; border: 2px solid var(--ink); border-radius: 4px; padding: 3px;
}
.battery::after {           /* kleiner Pol rechts */
  content: ""; position: absolute; right: -6px; top: 8px; width: 3px; height: 10px;
  background: var(--ink); border-radius: 0 2px 2px 0;
}
.battery i { display: block; height: 100%; width: 0; background: var(--ink); border-radius: 1px; }
.label { font-size: 12px; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <svg class="clock" viewBox="0 0 150 150" role="img" aria-label="Analoge Uhr">
    <g id="ticks"></g>
    <line id="h" x1="75" y1="75" x2="75" y2="42" stroke="#e9e9e7" stroke-width="2.5" stroke-linecap="round"/>
    <line id="m" x1="75" y1="75" x2="75" y2="26" stroke="#e9e9e7" stroke-width="1.8" stroke-linecap="round"/>
    <line id="s" x1="75" y1="84" x2="75" y2="22" stroke="#9b9b98" stroke-width="1" stroke-linecap="round"/>
    <text id="t" x="75" y="98" text-anchor="middle" font-size="12" fill="#e9e9e7" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" style="font-variant-numeric: tabular-nums">00:00:00</text>
    <text id="dt" x="75" y="112" text-anchor="middle" font-size="9.5" fill="#9b9b98" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"></text>
  </svg>

  <div class="bars">
    <div class="row"><div class="battery"><i id="b-y"></i></div><span class="label" id="l-y">Jahr: 0%</span></div>
    <div class="row"><div class="battery"><i id="b-m"></i></div><span class="label" id="l-m">Monat: 0%</span></div>
    <div class="row"><div class="battery"><i id="b-w"></i></div><span class="label" id="l-w">Woche: 0%</span></div>
  </div>
</div>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const ticks = document.getElementById('ticks');
  for (let i = 0; i < 12; i++) {
    const a = i * 30 * Math.PI / 180, big = i % 3 === 0;
    const r1 = big ? 58 : 62, r2 = 68;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 75 + Math.sin(a) * r1); l.setAttribute('y1', 75 - Math.cos(a) * r1);
    l.setAttribute('x2', 75 + Math.sin(a) * r2); l.setAttribute('y2', 75 - Math.cos(a) * r2);
    l.setAttribute('stroke', big ? '#e9e9e7' : '#6f6f6c'); l.setAttribute('stroke-width', big ? 2 : 1.4);
    l.setAttribute('stroke-linecap', 'round');
    ticks.appendChild(l);
  }
  const rot = (id, deg) => document.getElementById(id).setAttribute('transform', `rotate(${deg} 75 75)`);
  const pad = n => String(n).padStart(2, '0');
  const set = (k, name, r) => {
    const p = Math.max(0, Math.min(1, r));
    document.getElementById('b-' + k).style.width = (p * 100).toFixed(1) + '%';
    document.getElementById('l-' + k).textContent = name + ': ' + Math.floor(p * 100) + '%';
  };
  function tick() {
    const n = new Date(), h = n.getHours(), m = n.getMinutes(), s = n.getSeconds();
    rot('h', (h % 12) * 30 + m * 0.5);
    rot('m', m * 6 + s * 0.1);
    rot('s', s * 6);
    document.getElementById('t').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    document.getElementById('dt').textContent = n.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short' });

    const y0 = new Date(n.getFullYear(), 0, 1), y1 = new Date(n.getFullYear() + 1, 0, 1);
    const m0 = new Date(n.getFullYear(), n.getMonth(), 1), m1 = new Date(n.getFullYear(), n.getMonth() + 1, 1);
    const dow = (n.getDay() + 6) % 7;
    const w0 = new Date(n.getFullYear(), n.getMonth(), n.getDate() - dow), w1 = new Date(w0.getFullYear(), w0.getMonth(), w0.getDate() + 7);
    set('y', 'Jahr', (n - y0) / (y1 - y0));
    set('m', 'Monat', (n - m0) / (m1 - m0));
    set('w', 'Woche', (n - w0) / (w1 - w0));
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
